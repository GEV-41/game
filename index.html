<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAINTSTRIKE MULTIPLAYER</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu">
    <h1>PAINTSTRIKE</h1>
    <p>MULTIPLAYER ARENA</p>
    <input id="playerName" maxlength="16" placeholder="Enter player name">
    <button id="playButton">PLAY ONLINE</button>
    <p id="status">Ready to connect</p>
  </div>

  <div id="hud" hidden>
    <div class="topbar">
      <span>RED: <b id="redScore">0</b></span>
      <span>BLUE: <b id="blueScore">0</b></span>
      <span id="playerCount">Players: 0</span>
    </div>
    <div id="crosshair">+</div>
    <div class="bottom">
      <div>HEALTH <b id="healthText">100</b></div>
      <div id="healthBar"><div id="healthFill"></div></div>
      <p>WASD: Move · Mouse: Aim · Click: Shoot · Shift: Sprint</p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="game.js"></script>
</body>
</html>
